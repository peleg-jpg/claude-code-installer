name: Test installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    name: macOS installer
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer
        run: bash mac/install.sh --debug

      - name: Verify tools are installed
        run: |
          set -e
          # Source nvm so node/npm are visible
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          # Ensure bun is on PATH
          export PATH="$HOME/.bun/bin:$PATH"

          missing=()
          for t in code git node npm bun gh claude; do
            if command -v "$t" >/dev/null 2>&1; then
              ver=$("$t" --version 2>/dev/null | head -1)
              echo "OK:      $t  ($ver)"
            else
              echo "MISSING: $t"
              missing+=("$t")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing tools: ${missing[*]}"
            exit 1
          fi

      - name: Re-run installer (idempotency check)
        run: bash mac/install.sh

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse install.ps1 bootstrap
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

      - name: Run installer
        shell: pwsh
        run: |
          .\windows\src\installer.ps1 -Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tools are installed
        shell: pwsh
        run: |
          # Refresh PATH from registry (installer updates Machine/User PATH but pwsh session is stale)
          $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath    = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath"

          # Add common install locations the installer may have created
          foreach ($extra in @(
              "$env:USERPROFILE\.bun\bin",
              "$env:ProgramFiles\nodejs",
              "$env:ProgramFiles\Git\bin",
              "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin"
          )) {
              if ((Test-Path $extra) -and ($env:Path -notlike "*$extra*")) {
                  $env:Path += ";$extra"
              }
          }

          $missing = @()
          foreach ($t in @("code","git","node","npm","bun","gh","claude")) {
              $cmd = Get-Command $t -ErrorAction SilentlyContinue
              if ($cmd) {
                  $ver = (& $t --version 2>$null | Select-Object -First 1)
                  Write-Host "OK:      $t  ($ver)" -ForegroundColor Green
              } else {
                  Write-Host "MISSING: $t" -ForegroundColor Red
                  $missing += $t
              }
          }
          if ($missing.Count -gt 0) {
              Write-Host "::error::Missing tools: $($missing -join ', ')"
              exit 1
          }

      - name: Re-run installer (idempotency check)
        shell: pwsh
        run: |
          .\windows\src\installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  pin-check:
    name: CDN pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pinned jsDelivr SHA still matches the launchers
        run: |
          sha=$(grep -oE 'claude-code-installer@[0-9a-f]{40}' README.md | head -1 | cut -d@ -f2)
          echo "Pinned SHA: $sha"
          if ! git diff --quiet "$sha" HEAD -- mac/install.sh windows/install.ps1; then
            echo "::error::mac/install.sh or windows/install.ps1 changed but the jsDelivr fallback in the READMEs is still pinned to $sha. Update the @<sha> in README.md, mac/README.md, windows/README.md."
            exit 1
          fi
